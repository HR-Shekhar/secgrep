name: SecretGuard

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  secretguard:
    name: secretguard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so `secgrep history` and diff scans can see past commits.
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test

      - name: Build
        run: cargo build --release

      - name: Scan repository
        # Exit 1 fails this check. Merge is blocked only if this check is required
        # in branch protection / repository rulesets.
        run: ./target/release/secgrep scan . --format text

      - name: Scan pull request diff
        if: github.event_name == 'pull_request'
        run: |
          ./target/release/secgrep scan --diff "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" --format text
