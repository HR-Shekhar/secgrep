name: SecretGuard

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  secretguard:
    name: secretguard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test

      - name: Build
        run: cargo build --release

      - name: Scan repository
        # Exit 1 fails this check. Merge is blocked only if this check is required.
        run: |
          ./target/release/secgrep scan . --format text --verbose --github-annotations

      - name: Scan pull request diff
        if: github.event_name == 'pull_request'
        run: |
          ./target/release/secgrep scan \
            --diff "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" \
            --format text --verbose --github-annotations

      - name: Write SARIF
        if: always()
        run: |
          ./target/release/secgrep scan . --format sarif > secgrep.sarif || true

      - name: Upload SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: secgrep.sarif
