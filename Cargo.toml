[package]
name = "secgrep"
version = "0.1.0"
edition = "2021"
description = "SecretGuard — explainable secret scanning for Git workflows"
license = "MIT"
publish = false

[[bin]]
name = "secgrep"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "0.8"
walkdir = "2.5"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.13"
