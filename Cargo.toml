[package]
name = "secgrep"
version = "0.2.0"
edition = "2021"
description = "SecretGuard — explainable secret scanning for Git workflows"
license = "MIT"
repository = "https://github.com/HR-Shekhar/secgrep"
readme = "README.md"
keywords = ["security", "secrets", "git", "cli", "scanner"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[[bin]]
name = "secgrep"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rayon = "1.10"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "0.8"
ureq = { version = "2.12", default-features = true }
walkdir = "2.5"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.13"
